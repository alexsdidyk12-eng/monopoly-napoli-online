 if(c.t=='p'){const n=bOth(i,c),N=grp(c.g).length-1;v*=n>=N?1.9:n>=1?1.25:1}

 const m1=mine.filter(c=>canM(c)&&!(c.t=='p'&&full(i,c.g))).sort(byP)[0];if(m1){mg(m1.i);return}
 const s1=mine.filter(c=>c.t=='p'&&canS(c)).sort((x,y)=>S.b[y.i].h-S.b[x.i].h)[0];if(s1){sl(s1.i);return}
 const m2=mine.filter(c=>canM(c)).sort(byP)[0];if(m2){mg(m2.i);return}
 bk()}
function botDo(w){const i=w.i,p=S.p[i];
 switch(w.kind){
 case 'roll':if(p.jt>0){if(p.jf.length){uj();return}if(p.m>=450&&C.filter(c=>isP(c)&&S.b[c.i].o<0).length>=8){pj();return}}roll();return;
 case 'buy':{const c=C[p.pos],need=c.t=='p'?(bOth(i,c)>=grp(c.g).length-1?0:120):90;if(p.m>=c.pr&&p.m-c.pr>=need)buy();else dc();return}
 case 'card':ap();return;
 case 'act':botAct(i);return;
 case 'auc':{const a=S.au,c=C[a.pos];let v=pw(i,c);
  S.p.forEach((x,j)=>{if(j!=i&&!x.out&&c.t=='p'&&bOth(j,c)>=grp(c.g).length-1)v+=c.pr*.5});
  const gap=Math.min(Math.floor(v),p.m-30)-a.bid;
  if(a.lead!=i&&gap>=1){const k=gap>=150?50:gap>=15?10:1;if(p.m>=a.bid+k){bid(k);return}}

 case 'debt':botDebt(i);return;
 case 'trade':botRespond(i);return}}
function botFallback(w){const i=w.i,p=S.p[i];
 switch(w.kind){
 case 'roll':roll();break;
 case 'act':end();break;
 case 'buy':dc();break;
 case 'card':ap();break;
 case 'auc':ps();break;
 case 'debt':bk();break;
 case 'trade':S.tr=null;V=null;render();break}}
const bsig=()=>JSON.stringify([S.ph,S.cur,S.dbl,S.tn,S.p.map(x=>[x.pos,x.m,x.jt,x.out,x.jf.length]),S.b.map(b=>[b.o,b.h,b.z]),S.au&&[S.au.bid,S.au.lead,S.au.t,S.au.act.length],S.debt&&S.debt.a,S.tr?[S.tr.st,S.tr.ca,S.tr.cb]:0,S.cd&&S.cd.id]);
function botTick(){BTM=0;if(!S||BOFF)return;const w=botWho();if(!w){return}
 const before=bsig();BA=1;let err=0;
 try{botDo(w)}catch(e){err=1;console.error('bot',e)}
 if(!err&&S&&bsig()==before)BCNT++;else BCNT=err?BCNT+2:0;
 if(S&&BCNT>=3&&botWho()){try{botFallback(w)}catch(e){console.error('bot fallback',e);BCNT+=2}if(bsig()!=before)BCNT=0}
 BA=0;
 if(S&&BCNT>=7){BOFF=1;BCNT=0;L('Автоходы ботов приостановлены из-за сбоя — управление передано игрокам');render();return}
 botKick()}
function botKick(){if(BTM||BOFF||!S)return;if(S.tr&&!(V&&V.t=='t'))S.tr=null;
 if(!botWho())return;BTM=setTimeout(botTick,Math.max(CFG.an?650*CFG.sp:120,HOLD-Date.now()+150))}
function botUI(){const w=BOFF?null:botWho();if(!w||w.kind=='trade')return;
 const re=/^(roll|end|buy|dc|ap|pd|bk|ps|bid|pj|uj|bd|sl|mg|um|openT)\(/,rm=/openT\(|t:'m'/;
 document.querySelectorAll('.bar button, .mb button').forEach(b=>{const o=b.getAttribute('onclick')||'';if(re.test(o)||rm.test(o))b.disabled=true});
 const h=document.querySelector('.bar .hint');if(h)h.textContent='🤖 '+S.p[w.i].n+' думает…'}

/* ===== единый render: порядок стадий = прежняя цепочка обёрток ===== */
function render(){
 const mb0=document.querySelector('.mb'),sc=mb0?mb0.scrollTop:0;
 if(S)ens();
 if(!S){LP={};drawMain();document.body.classList.toggle('gl',false);return}
 holdCalc();drawMain();overlay3D();hilite();glSync();
 try{post()}catch(e){console.error(e)}
 const n=document.querySelector('.mb');if(n&&sc&&!NEWM)n.scrollTop=sc;
 if(G3)try{lay()}catch(e){}
 try{botUI()}catch(e){}
 botKick()}
applyCfg();
try{if(localStorage.getItem('napoli')&&!sessionStorage.getItem('nm'))load();else render()}catch(e){render()}
</script>
<script data-online-client>
/* =====================================================================================================
   ОНЛАЙН-РЕЖИМ MONOPOLY: NAPOLI (Socket.IO)
   Этот блок добавлен к вашей игре. Оригинальные правила, 3D-сцена и интерфейс не изменены.
   В онлайн-партии клиент НЕ считает правила сам: он отправляет серверу намерения («бросить», «купить»,
   «ставка +10»…), а сервер выполняет ваш же игровой код (скрипты data-engine) и рассылает состояние всем.

   Страница и сервер находятся на одном адресе (Render): клиент подключается к тому же адресу, с которого
   открыта игра. Никаких адресов в коде прописывать не нужно, Netlify не используется.
   ===================================================================================================== */
(function(){
const SKEY='napoli_online_session',NKEY='napoli_online_name';
const ONL={on:0,sock:null,conn:0,connecting:0,room:null,id:null,seat:-1,seq:0,msg:'',codeIn:'',nick:'',hid:'',lastAct:0,panel:0,sig:'',trSeen:0,thLen:0,pending:0};
window.ONL=ONL;
const ses=()=>{try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');return s&&s.code&&s.token&&Date.now()-s.at<12*3600e3?s:null}catch(e){return null}};
const setSes=s=>{try{s?localStorage.setItem(SKEY,JSON.stringify(Object.assign({at:Date.now()},s))):localStorage.removeItem(SKEY)}catch(e){}};
const savedName=()=>{try{return localStorage.getItem(NKEY)||''}catch(e){return''}};
const serverUrl=()=>location.origin;
const actionSeat=()=>{if(!S||S.ph=='win')return-1;if(S.ph=='auc'&&S.au&&S.au.act.length)return S.au.act[S.au.t];return S.debt?S.debt.f:S.cur};
const hkey=()=>S.ph+'|'+S.tn+'|'+S.cur+'|'+(S.au?S.au.pos:'')+'|'+(S.debt?S.debt.f+':'+S.debt.a:'')+'|'+(actionSeat()===ONL.seat?1:0);
const editing=()=>{const a=document.activeElement;return !!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.closest&&a.closest('.mb'))};
function refresh(){if(!ONL.on&&editing()){ONL.pending=1;return}ONL.pending=0;render()}
addEventListener('focusout',()=>{if(ONL.pending)setTimeout(()=>{if(!editing())refresh()},50)});

/* ---------- подключение ---------- */
/* клиент Socket.IO отдаёт сам сервер (та же версия, что и на сервере); подгружается только при входе в онлайн-режим */
function loadIO(url,cb,fail){
 if(window.io)return cb();
 const s=document.createElement('script');s.src=url+'/socket.io/socket.io.js';
 s.onload=()=>window.io?cb():fail();s.onerror=()=>{s.remove();fail()};document.head.appendChild(s)}
function connect(){
 if(ONL.sock||ONL.connecting)return;
 const url=serverUrl();
 if(!/^https?:/.test(url)){ONL.msg='Онлайн-режим работает, когда игра открыта по ссылке сервера (http/https), а не как файл на устройстве.';refresh();return}
 ONL.connecting=1;ONL.msg='';refresh();
 loadIO(url,()=>{
  const s=ONL.sock=io(url,{transports:['websocket','polling'],reconnection:true,reconnectionDelay:1000,reconnectionDelayMax:5000,timeout:20000});
  s.on('connect',()=>{ONL.conn=1;ONL.connecting=0;ONL.msg='';const se=ses();if(se)rejoin(se);refresh()});
  s.on('disconnect',()=>{ONL.conn=0;refresh()});
  s.on('connect_error',()=>{ONL.conn=0;ONL.connecting=1;ONL.msg='Нет связи с сервером. Бесплатный сервер может «просыпаться» до минуты — пробуем снова…';refresh()});
  s.on('room',r=>{ONL.room=r;ONL.id=r.you;ONL.seat=r.seat;refresh()});
  s.on('state',applyState);
  s.on('kicked',k=>{try{s.disconnect()}catch(e){}ONL.sock=null;ONL.conn=0;resetOnline((k&&k.reason)||'Вы подключились с другого устройства или вкладки.',1)});
 },()=>{ONL.connecting=0;ONL.msg='Не удалось связаться с сервером. Проверьте интернет и попробуйте ещё раз.';refresh()});
}
function rejoin(se){
 ONL.sock.emit('room:rejoin',{code:se.code,token:se.token},ack=>{
  if(ack&&ack.ok)return;
  if(ack&&ack.gone){setSes(null);resetOnline('Комната или партия больше не существует.',0)}
  else{ONL.msg=(ack&&ack.error)||'Не удалось вернуться в комнату';refresh()}})}
function resetOnline(msg,keepSession){
 const had=ONL.on||ONL.room;
 if(!keepSession)setSes(null);
 ONL.room=null;ONL.on=0;ONL.seq=0;ONL.seat=-1;ONL.id=null;ONL.hid='';ONL.panel=0;ONL.sig='';ONL.msg=msg||'';
 if(ONL.sock&&!keepSession){try{ONL.sock.disconnect()}catch(e){}ONL.sock=null;ONL.conn=0;ONL.connecting=0}
 S=null;V=null;LP={};DR=0;SV=had?'online':SV;
 ['onl-pill','onl-panel','onl-off'].forEach(i=>{const e=document.getElementById(i);if(e)e.remove()});
 render()}
const emit=(ev,data,cb)=>{const s=ONL.sock;if(!s||!s.connected){ONL.msg='Нет связи с сервером. Подождите, идёт подключение…';refresh();return false}s.emit(ev,data||{},a=>{if(a&&a.ok===false)ONL.msg=a.error||'Ошибка';else if(a&&a.ok)ONL.msg='';cb&&cb(a);refresh()});return true};

/* ---------- получение состояния партии от сервера ---------- */
function applyState(p){
 if(!p||typeof p.state!=='string')return;
 if(p.seq<=ONL.seq&&!p.resync)return;
 let ns;try{ns=JSON.parse(p.state)}catch(e){return}
 ONL.seq=p.seq;
 const prevTr=S&&S.tr?1:0,prevTh=S&&S.th?S.th.length:0;
 if(!ONL.on||!S){ONL.on=1;S=ns;V=null;SV=null;LP={};DR=0;ONL.hid='';ONL.sig=''}
 else{Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,ns)}
 ONL.on=1;
 if(p.resync)LP={};
 (p.toasts||[]).forEach(t=>{try{toast(t)}catch(e){}});
 (p.fx||[]).forEach(k=>{try{AU.fx(k)}catch(e){}});
 (p.fq||[]).forEach(q=>{if(Array.isArray(q)&&FQ.length<8)FQ.push(q)});
 if(p.roll){ROLLT=Date.now();DR=1}
 const me=ONL.seat,T=S.tr;
 if(V&&V.t=='t'&&(!T||(T.a!==me&&!(T.b===me&&T.st===1)))){if(!T&&prevTr&&S.th.length===prevTh&&S.ph!='win')try{toast('Сделка не состоялась')}catch(e){}V=null}
 if(T&&T.b===me&&T.st===1&&!(V&&V.t=='t'))V={t:'t'};
 if(p.resync&&T&&T.a===me&&!(V&&V.t=='t'))V={t:'t'};
 const sig=S.ph+'|'+S.tn+'|'+(S.au?S.au.t+':'+S.au.bid:'');
 if(['buy','card','auc','debt'].indexOf(S.ph)>=0&&actionSeat()===me&&sig!==ONL.sig&&V&&['i','o','k','l','x'].indexOf(V.t)>=0)V=null;
 ONL.sig=sig;
 render()}

/* ---------- отправка действий на сервер ---------- */
ONL.act=function(type,args,onFail){
 const s=ONL.sock;
 if(!s||!s.connected){try{toast('Нет связи с сервером')}catch(e){}onFail&&onFail();return}
 s.emit('game:act',{type:type,args:args||[]},ack=>{if(!ack||!ack.ok){if(ack&&ack.error){try{toast(ack.error)}catch(e){}}onFail&&onFail()}})};
document.addEventListener('click',e=>{
 if(!ONL.on)return;
 const b=e.target&&e.target.closest?e.target.closest('button'):null;if(!b||b.disabled)return;
 const o=(b.getAttribute('onclick')||'').trim();let m,type=null,args=[];
 if((m=/^(roll|end|buy|dc|ap|pd|bk|ps|pj|uj)\(\)$/.exec(o)))type=m[1];
 else if(o==='acc()')type='trade_accept';
 else if((m=/^bid\((\d+)\)$/.exec(o))){type='bid';args=[+m[1]]}
 else if((m=/^(bd|sl|mg|um)\((\d+)\)$/.exec(o))){type=m[1];args=[+m[2]]}
 else if(/^V=\{t:'t'\};openT\(\)$/.test(o))type='trade_open';
 else return;
 e.stopImmediatePropagation();e.preventDefault();
 const n=Date.now();if(n-ONL.lastAct<350)return;ONL.lastAct=n;
 if(type==='trade_open'){V={t:'t'};ONL.act(type,[],()=>{V=null;render()});render();return}
 ONL.act(type,args)},true);
ONL.tg=(k,i)=>ONL.act('trade_toggle',[k,i]);
ONL.tc=(v,k)=>ONL.act('trade_cash',[k,Math.max(0,Math.floor(+v||0))]);
ONL.tb=b=>ONL.act('trade_partner',[b]);
ONL.tp=()=>ONL.act('trade_propose');
ONL.te=()=>ONL.act('trade_edit');
ONL.tx=()=>{ONL.act('trade_cancel');V=null;render()};

/* ---------- лобби: действия ---------- */
const nickVal=()=>{const n=(ONL.nick||savedName()||'').replace(/[<>&"'`]/g,'').trim().slice(0,14);return n||'Игрок'};
const lobbyReady=()=>{const R=ONL.room;if(!R)return{ok:false,why:''};const pl=R.players.filter(p=>!p.left);
 if(pl.length<2)return{ok:false,why:'Нужно минимум 2 игрока'};
 const off=pl.filter(p=>!p.connected);if(off.length)return{ok:false,why:'Нет связи: '+off.map(p=>p.name).join(', ')};
 const nr=pl.filter(p=>!p.host&&!p.ready);if(nr.length)return{ok:false,why:'Ждём готовности: '+nr.map(p=>p.name).join(', ')};
 return{ok:true,why:''}};
ONL.open=()=>{SV='online';ONL.msg='';if(!ONL.nick)ONL.nick=savedName();connect();render()};
ONL.close=()=>{SV=null;render()};
ONL.setName=v=>{ONL.nick=String(v||'').replace(/[<>&"'`]/g,'').slice(0,14);try{localStorage.setItem(NKEY,ONL.nick)}catch(e){}if(ONL.room&&!ONL.room.started)emit('room:profile',{name:ONL.nick})};
ONL.create=()=>{try{localStorage.setItem(NKEY,nickVal())}catch(e){}emit('room:create',{name:nickVal()},a=>{if(a&&a.ok)setSes({code:a.code,token:a.token,name:nickVal()})})};
ONL.join=()=>{const code=String(ONL.codeIn||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4){ONL.msg='Введите код комнаты';render();return}
 try{localStorage.setItem(NKEY,nickVal())}catch(e){}emit('room:join',{code:code,name:nickVal()},a=>{if(a&&a.ok)setSes({code:a.code,token:a.token,name:nickVal()})})};
ONL.ready=v=>emit('room:ready',{ready:!!v});
ONL.setT=t=>emit('room:profile',{t:t});
ONL.setC=c=>emit('room:profile',{ci:c});
ONL.setMode=v=>emit('room:settings',{mode:+v});
ONL.setRounds=v=>emit('room:settings',{rounds:+v});
ONL.start=()=>emit('room:start',{});
ONL.cancelRejoin=()=>{setSes(null);if(ONL.sock){try{ONL.sock.disconnect()}catch(e){}ONL.sock=null}ONL.conn=0;ONL.connecting=0;ONL.msg='';render()};
ONL.copy=()=>{const R=ONL.room;if(!R)return;const link=location.href.split('#')[0].split('?')[0]+'?room='+R.code;
 const done=()=>{try{toast('Ссылка-приглашение скопирована')}catch(e){}};
 try{navigator.clipboard.writeText(link).then(done,()=>prompt('Скопируйте ссылку:',link))}catch(e){prompt('Скопируйте ссылку:',link)}};
ONL.exit=()=>{
 const me=S&&ONL.on?S.p[ONL.seat]:null,inGame=!!(me&&!me.out&&S.ph!='win');
 if(inGame&&!confirm('Выйти из партии? Вы будете исключены, а ваше имущество уйдёт на аукцион.'))return;
 const s=ONL.sock;
 if(s&&s.connected)s.emit('room:leave',{},()=>{});
 resetOnline('',0);SV=null;render()};
ONL.hide=()=>{ONL.hid=hkey();render()};
ONL.togglePanel=()=>{ONL.panel=ONL.panel?0:1;render()};

/* ---------- меню: кнопка «Онлайн» и панель лобби ---------- */
const _menu=menu;
menu=function(){let h=_menu();
 h=h.replace('<span>▶</span>Новая игра','<span>🏠</span>Локальная игра');

 if(SV=='online')h+=lobbyHTML();
 return h};
function statusLine(){return ONL.conn?'🟢 Подключено к серверу':ONL.connecting?'⏳ Подключение к серверу…':'🔴 Нет связи с сервером'}
function lobbyHTML(){
 const R=ONL.room,se=ses(),msg=ONL.msg?`<p style="color:#ffb3a7">${esc(ONL.msg)}</p>`:'';

  h+=`<p>Игроков: ${R.players.filter(p=>!p.left).length} из ${R.max}</p>`;
  h+=`<div class=r><b>Ваш профиль</b><br><input maxlength=14 value="${esc(me.name||'')}" placeholder="Ник" onchange="ONL.setName(this.value)" size=11> <select onchange="ONL.setT(+this.value)">${TK.map((t,k)=>`<option value=${k} ${k==me.t?'selected':''} ${R.players.some(p=>p.id!==R.you&&p.t==k)?'disabled':''}>${t}</option>`).join('')}</select><br>${PC.map((c,k)=>{const taken=R.players.some(p=>p.id!==R.you&&p.ci==k);return `<button aria-label="Цвет ${k+1}" ${taken?'disabled':''} onclick="ONL.setC(${k})" style="background:${c};width:34px;height:34px;padding:0;border-radius:50%;${k==me.ci?'outline:3px solid #fff':''}"></button>`}).join('')}</div>`;
  if(isHost)h+=`<div class=r><b>Режим игры</b><br><select onchange="ONL.setMode(this.value)"><option value=0 ${R.mode?'':'selected'}>Классика — до последнего игрока</option><option value=1 ${R.mode?'selected':''}>На N кругов — победа по капиталу</option></select>${R.mode?` Кругов: <input type=number min=3 max=200 value=${R.rounds} style="width:76px" onchange="ONL.setRounds(this.value)">`:''}</div>`;
  else h+=`<p><small>Режим: ${R.mode?'на '+R.rounds+' кругов (победа по капиталу)':'классика — до последнего игрока'}</small></p>`;
  h+=msg;

  else h+=`<p><button class=${me.ready?'':'p'} onclick="ONL.ready(${me.ready?0:1})">${me.ready?'↩ Я не готов':'✅ Готов'}</button> <small>Игру начнёт создатель комнаты</small></p>`;

  return mb(h)}
 if(se&&(ONL.connecting||ONL.conn))return mb(h+`<p>Возвращаемся в комнату <b>${esc(se.code)}</b>…</p>${msg}<button onclick="ONL.cancelRejoin()">Отмена</button>`);
 h+=`<p>Играйте с друзьями по сети: до 8 реальных игроков, без ботов.</p><div class=r><input id=onl-nick maxlength=14 placeholder="Ваш ник" value="${esc(ONL.nick||savedName())}" oninput="ONL.nick=this.value" onchange="ONL.setName(this.value)" size=14></div>`;
 h+=`<div class=r><button class=p onclick="ONL.create()">➕ Создать комнату</button></div><div class=r><input id=onl-code maxlength=5 placeholder="КОД" style="text-transform:uppercase;width:90px;text-align:center;letter-spacing:.2em" value="${esc(ONL.codeIn)}" oninput="ONL.codeIn=this.value.toUpperCase()"> <button onclick="ONL.join()">Войти по коду</button></div>`;
 if(se)h+=`<div class=r><button onclick="ONL.open();ONL.conn&&rejoinNow()">↩ Вернуться в комнату ${esc(se.code)}</button></div>`;
 return mb(h+msg+`<button onclick="ONL.close()">Назад</button>`)}
window.rejoinNow=()=>{const se=ses();if(se&&ONL.sock&&ONL.sock.connected)rejoin(se)};

/* ---------- окно сделки (онлайн-версия: то же оформление, действия идут через сервер) ---------- */
const _tradeV=tradeV;
tradeV=function(){
 if(!ONL.on)return _tradeV();
 const t=S.tr;
 if(!t)return mb(`<h3>🤝 Сделка</h3><p>Загрузка…</p><button onclick="V=null;render()">Закрыть</button>`);
 const me=ONL.seat,a=t.a,b=t.b,f=(l,c)=>(l.length?l.map(i=>C[i].n).join(', '):'')+(c?(l.length?' + ':'')+'€ '+c:'')||'ничего',
  sum=`<div class=r><b>Итог сделки</b><br>${esc(nm(a))} отдаёт: ${esc(f(t.pa,t.ca))}<br>${esc(nm(b))} отдаёт: ${esc(f(t.pb,t.cb))}</div>`,
  err=t.err?`<p style="color:#d33">${esc(t.err)}</p>`:'';
 if(a!==me){
  if(b===me&&t.st===1)return mb(`<h3>🤝 Предложение сделки</h3>${err}${sum}<p><b>${esc(nm(b))}</b>, принимаете сделку?</p><button class=p onclick="acc()">Принять</button><button onclick="ONL.tx()">Отклонить</button>`);
  return mb(`<h3>🤝 Сделка</h3><p>${esc(nm(a))} обсуждает сделку с ${esc(nm(b))}…</p><button onclick="V=null;render()">Закрыть</button>`)}
 if(t.st===1)return mb(`<h3>🤝 Сделка</h3>${err}${sum}<p>Ждём ответа: <b>${esc(nm(b))}</b>…</p><button onclick="ONL.te()">Изменить</button><button onclick="ONL.tx()">Отозвать</button>`);
 const col=(o,k,ca)=>`<div class=cl><b>${esc(nm(o))}</b>${tp(o).map(c=>`<label><input type=checkbox ${t[k].includes(c.i)?'checked':''} onchange="ONL.tg('${k}',${c.i})">${esc(c.n)}${S.b[c.i].z?' (залог)':''}</label>`).join('')}<label>€ <input type=number min=0 value=${t[ca]} onchange="ONL.tc(this.value,'${ca}')"></label></div>`;
 return mb(`<h3>🤝 Сделка</h3><p>Партнёр: <select onchange="ONL.tb(+this.value)">${S.p.map((x,i)=>i!=a&&!x.out?`<option value=${i} ${i==b?'selected':''}>${esc(x.n)}</option>`:'').join('')}</select></p>${err}<div class=g2>${col(a,'pa','ca')}${col(b,'pb','cb')}</div><button class=p onclick="ONL.tp()">Предложить</button><button onclick="ONL.tx()">Отмена</button>`)};

/* ---------- прочие обёртки ---------- */
const _save=save;save=function(){if(ONL.on)return;_save()};
const _leave=leave;leave=function(){if(ONL.on){ONL.exit();return}_leave()};
const _botKick=botKick;botKick=function(){if(ONL.on)return;_botKick()};
const _modal=modal;
modal=function(){
 if(ONL.on&&S&&!V&&['buy','card','debt','auc'].indexOf(S.ph)>=0&&ONL.hid&&ONL.hid===hkey())return'';
 return _modal()};
const _render=render;
render=function(){_render.apply(this,arguments);try{decor()}catch(e){console.error('online decor',e)}};

function decor(){
 if(!ONL.on||!S)return;
 const me=ONL.seat,act=actionSeat(),off=!ONL.conn,R=ONL.room,mine=S.p[me];
 /* кнопки: управлять может только тот, чья очередь (сервер проверяет это ещё раз) */
 document.querySelectorAll('.bar button, .mb button').forEach(b=>{
  const o=b.getAttribute('onclick')||'',m=/^(\w+)\(/.exec(o),n=m?m[1]:'';let need=null;
  if(n==='acc')need=S.tr&&S.tr.st===1?S.tr.b:-9;
  else if(n==='bid'||n==='ps')need=act;
  else if(n==='buy'||n==='dc'||n==='ap')need=S.cur;
  else if(n==='pd'||n==='bk')need=S.debt?S.debt.f:-9;
  else if(/^(roll|end|pj|uj|bd|sl|mg|um)$/.test(n)||/openT\(/.test(o))need=S.debt?S.debt.f:S.cur;
  if(need!==null&&(need!==me||off))b.disabled=true;
  if(/leave\(\)/.test(o)&&/Сохранить/.test(b.textContent))b.textContent='🚪 Покинуть партию'});
 /* карточки игроков: «вы» и состояние связи */
 const cards=document.querySelectorAll('.side .pcd');
 cards.forEach((el,i)=>{const x=S.p[i],rp=R&&R.players?R.players[i]:null,nb=el.querySelector('.pi b');if(!x||!nb)return;
  if(i===me)nb.insertAdjacentText('beforeend',' (вы)');
  if(rp&&!x.out&&!rp.connected)nb.insertAdjacentText('beforeend',' 💤')});
 const h=document.querySelector('.bar .hint');
 if(h){if(act===me&&S.ph!='win'&&!off)h.textContent='👉 Ваш ход: '+h.textContent;else if(mine&&mine.out&&S.ph!='win')h.textContent='Вы выбыли из партии · вы наблюдаете за игрой'}
 /* зрители могут скрыть окно чужого хода */
 if(!V&&['buy','card','debt','auc'].indexOf(S.ph)>=0&&act!==me){const mb2=document.querySelector('.md .mb');if(mb2)mb2.insertAdjacentHTML('beforeend','<p><button onclick="ONL.hide()">Скрыть окно</button></p>')}
 pill();
 /* баннер потери связи */
 let ob=document.getElementById('onl-off');
 if(off){if(!ob){ob=document.createElement('div');ob.id='onl-off';document.body.appendChild(ob)}ob.textContent='🔴 Связь потеряна — переподключаемся… Игра сохранена на сервере.'}
 else if(ob)ob.remove();
 /* панель комнаты */
 let pn=document.getElementById('onl-panel');
 if(ONL.panel){if(!pn){pn=document.createElement('div');pn.id='onl-panel';document.body.appendChild(pn)}
  pn.innerHTML=`<div class=md style="z-index:70"><div class=mb><h3>🌐 Комната ${esc(R?R.code:'')}</h3>${S.p.map((x,i)=>{const rp=R&&R.players?R.players[i]:null;return `<div class=r>${AV[i]} ${TK[x.t]} <b>${esc(x.n)}</b>${i===me?' (вы)':''} — ${x.out?(rp&&rp.left?'вышел':'банкрот'):rp&&rp.connected?'🟢 онлайн':'💤 нет связи'}</div>`}).join('')}<p><small>Если игрок отключился, его место сохраняется. Если ход ждёт отключённого игрока, сервер сделает безопасные ходы за него.</small></p><button onclick="ONL.togglePanel()">Закрыть</button><button onclick="ONL.exit()">🚪 Покинуть партию</button></div></div>`}
 else if(pn)pn.remove()}
function pill(){
 let p=document.getElementById('onl-pill');
 if(!p){p=document.createElement('button');p.id='onl-pill';p.onclick=()=>ONL.togglePanel();document.body.appendChild(p)}
 const R=ONL.room;p.textContent='🌐 '+(R?R.code:'')+' '+(ONL.conn?'🟢':'🔴')}

/* ---------- стили онлайн-режима ---------- */
const st=document.createElement('style');
st.textContent=`#onl-pill{position:fixed;left:6px;bottom:calc(var(--bh,64px) + 8px);z-index:62;padding:4px 9px;margin:0;font-size:12px;min-height:0;border-radius:14px;opacity:.9}
#onl-off{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:80;background:#7a1d1d;color:#fff;border:2px solid #ffb3a7;border-radius:12px;padding:8px 14px;font-size:13px;max-width:92vw;text-align:center}`;
document.head.appendChild(st);

/* ---------- запуск: возврат в партию и приглашения по ссылке ---------- */
(function init(){
 const se=ses();let room='';
 try{room=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5)}catch(e){}
 ONL.nick=savedName();
 if(se){ if(S&&!ONL.on){S=null;V=null} SV='online';connect() }
 else if(room&&!S){ONL.codeIn=room;SV='online';connect()}
 render()})();
})();
</script>
<script>/* ЧАСТЬ 4: исправление наложения HUD на карточки игроков */
(function(){let q=0;const fix=()=>{q=0;const sd=document.querySelector('.side'),h=document.getElementById('hud');if(!sd||!h)return;
const mob=EW()<900,b=mob?Math.ceil(sd.getBoundingClientRect().bottom)+8:10;document.documentElement.style.setProperty('--sh',b+'px');
try{if(typeof lay=='function')lay()}catch(e){}};
const sch=()=>{if(!q)q=requestAnimationFrame(fix)};
const ro=window.ResizeObserver?new ResizeObserver(sch):null;let cur=null;
const watch=()=>{const sd=document.querySelector('.side');if(sd&&sd!==cur){cur=sd;ro&&ro.observe(sd)}sch()};
new MutationObserver(watch).observe(document.getElementById('app'),{childList:true,subtree:true});
addEventListener('resize',sch);addEventListener('orientationchange',()=>setTimeout(sch,200));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sch);setInterval(sch,1500);watch()})();
</script>
